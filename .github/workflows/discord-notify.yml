name: Discord notifications

on:
  pull_request:
    types: [closed]
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  merged-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord about merged PR
        env:
          DISCORD_GITHUB_WEBHOOK: ${{ secrets.DISCORD_GITHUB_WEBHOOK }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DISCORD_GITHUB_WEBHOOK:-}" || { echo "DISCORD_GITHUB_WEBHOOK is not configured" >&2; exit 1; }
          python3 - <<'PY'
          import json, os, urllib.request

          payload = {
              "username": "MediaOps GitHub",
              "embeds": [{
                  "title": f"🔀 PR #{os.environ['PR_NUMBER']} merged into main",
                  "description": os.environ['PR_TITLE'],
                  "url": os.environ['PR_URL'],
                  "color": 5763719,
                  "fields": [
                      {"name": "Author", "value": os.environ['PR_AUTHOR'], "inline": True},
                      {"name": "Merge", "value": os.environ['MERGE_SHA'][:7], "inline": True},
                  ],
                  "footer": {"text": "MediaOps • GitHub Updates"},
              }],
          }
          req = urllib.request.Request(
              os.environ["DISCORD_GITHUB_WEBHOOK"],
              data=json.dumps(payload).encode(),
              method="POST",
              headers={"Content-Type": "application/json", "User-Agent": "MediaOps-GitHub"},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              if response.status not in (200, 204):
                  raise RuntimeError(f"Discord returned HTTP {response.status}")
          PY

  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord about release
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_AUTHOR: ${{ github.event.release.author.login }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DISCORD_RELEASE_WEBHOOK:-}" || { echo "DISCORD_RELEASE_WEBHOOK is not configured" >&2; exit 1; }
          python3 - <<'PY'
          import json, os, urllib.request

          name = os.environ.get("RELEASE_NAME") or os.environ["RELEASE_TAG"]
          payload = {
              "username": "MediaOps Releases",
              "content": "@here",
              "allowed_mentions": {"parse": ["everyone"]},
              "embeds": [{
                  "title": f"🚀 {name} released",
                  "description": "A new MediaOps release is now available.",
                  "url": os.environ["RELEASE_URL"],
                  "color": 5763719,
                  "fields": [
                      {"name": "Version", "value": os.environ["RELEASE_TAG"], "inline": True},
                      {"name": "Published by", "value": os.environ["RELEASE_AUTHOR"], "inline": True},
                  ],
                  "footer": {"text": "MediaOps • Releases"},
              }],
          }
          req = urllib.request.Request(
              os.environ["DISCORD_RELEASE_WEBHOOK"],
              data=json.dumps(payload).encode(),
              method="POST",
              headers={"Content-Type": "application/json", "User-Agent": "MediaOps-GitHub"},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              if response.status not in (200, 204):
                  raise RuntimeError(f"Discord returned HTTP {response.status}")
          PY

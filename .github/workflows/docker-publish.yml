name: Build and publish MediaOps

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'harden/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: miakkia/mediaops
  ROUTER_IMAGE_NAME: miakkia/mediaops-ombi-discord-router

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Validate Ombi Discord Router syntax
        run: python -m py_compile addons/ombi-discord-router/app.py

      - name: Build Ombi Discord Router addon
        run: docker build -t mediaops-ombi-discord-router:test addons/ombi-discord-router

  build-and-push:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set build channel
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "MEDIAOPS_BUILD_CHANNEL=latest" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_REF}" == refs/heads/feat/* || "${GITHUB_REF}" == refs/heads/fix/* || "${GITHUB_REF}" == refs/heads/chore/* || "${GITHUB_REF}" == refs/heads/harden/* ]]; then
            echo "MEDIAOPS_BUILD_CHANNEL=dev" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "MEDIAOPS_BUILD_CHANNEL=release" >> "$GITHUB_ENV"
          else
            echo "MEDIAOPS_BUILD_CHANNEL=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Generate MediaOps image metadata
        id: mediaops-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev,enable=${{ startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/fix/') || startsWith(github.ref, 'refs/heads/chore/') || startsWith(github.ref, 'refs/heads/harden/') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Generate router image metadata
        id: router-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ROUTER_IMAGE_NAME }}
          tags: |
            type=raw,value=dev,enable=${{ startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/fix/') || startsWith(github.ref, 'refs/heads/chore/') || startsWith(github.ref, 'refs/heads/harden/') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push MediaOps
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.mediaops-meta.outputs.tags }}
          labels: ${{ steps.mediaops-meta.outputs.labels }}
          build-args: |
            MEDIAOPS_BUILD_SHA=${{ github.sha }}
            MEDIAOPS_BUILD_CHANNEL=${{ env.MEDIAOPS_BUILD_CHANNEL }}
          cache-from: type=gha,scope=mediaops
          cache-to: type=gha,mode=max,scope=mediaops

      - name: Build and push Ombi Discord Router
        uses: docker/build-push-action@v6
        with:
          context: ./addons/ombi-discord-router
          file: ./addons/ombi-discord-router/Dockerfile
          push: true
          tags: ${{ steps.router-meta.outputs.tags }}
          labels: ${{ steps.router-meta.outputs.labels }}
          cache-from: type=gha,scope=ombi-discord-router
          cache-to: type=gha,mode=max,scope=ombi-discord-router
